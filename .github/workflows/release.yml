name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build extension
        run: pnpm build
      
      - name: Create zip archive
        run: |
          cd dist
          zip -r ../zui-ti-${{ github.ref_name }}.zip .
          cd ..
      
      - name: Create CRX file
        run: |
          npm install -g crx3
          echo "${{ secrets.CRX_PRIVATE_KEY }}" > extension-key.pem
          crx3 dist -p extension-key.pem -o zui-ti-${{ github.ref_name }}.crx
          rm extension-key.pem
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            zui-ti-${{ github.ref_name }}.zip
            zui-ti-${{ github.ref_name }}.crx
          body: |
            ## ZuiTi ${{ github.ref_name }}
            
            ### Installation
            
            **Option 1: CRX (Recommended)**
            1. Download `zui-ti-${{ github.ref_name }}.crx`
            2. Open Chrome and go to `chrome://extensions/`
            3. Enable "Developer mode"
            4. Drag and drop the .crx file onto the page
            
            **Option 2: Unpacked**
            1. Download `zui-ti-${{ github.ref_name }}.zip`
            2. Extract the zip file
            3. Open Chrome and go to `chrome://extensions/`
            4. Enable "Developer mode"
            5. Click "Load unpacked" and select the extracted folder
            
            ### Features
            - AI-powered reply generation for X (Twitter)
            - Support for multiple AI providers (Gemini, OpenAI, Claude, DeepSeek)
            - Automatic model rotation for increased daily quota
            - Multiple reply styles
            - Rate limiting and safety features
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
